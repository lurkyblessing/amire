    <style>
        .sarafina-hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
        }

        .sarafina-title {
            font-size: 4rem;
            color: var(--color-sage);
            margin-bottom: 1rem;
            font-weight: 400;
        }

        .sarafina-subtitle {
            font-size: 1.5rem;
            color: var(--color-pink);
            max-width: 600px;
            line-height: 1.6;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            color: var(--color-sage);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .product-reveal-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 1rem;
        }
        
        .product-image-container {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 4/3;
            background: linear-gradient(135deg, var(--color-sage), var(--color-pink));
            border-radius: 20px;
            margin-bottom: 2rem;
            /* Start with a heavy blur */
            filter: blur(30px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-brown);
            font-size: 2rem;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: filter 0.1s;
        }

        .colorways {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease-out;
        }

        .color-swatch {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .color-swatch:hover {
            transform: scale(1.15);
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .preorder-btn {
            display: inline-block;
            text-decoration: none;
            padding: 1.2rem 4rem;
            background: var(--color-sage);
            color: var(--color-brown);
            font-weight: 600;
            font-size: 1.1rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .preorder-btn:hover {
            background: var(--color-pink);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(243, 197, 205, 0.3);
        }
    </style>
</head>
<body>
    <header class="main-header">
        <a href="/" class="submark-link">
            <img src="amire-submark.png" alt="amiré submark" class="submark-img" style="height: 80px; width: auto; display: block;">
        </a>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/sarafina-shades" class="active">Sarafina Shades</a>

    <div class="sarafina-hero">
        <h2 class="sarafina-title">sarafina shades</h2>
        <p class="sarafina-subtitle">
            the flagship product that started it all. functional, flawless, and curated for the cool girl energy you exude.
        </p>
        <div class="scroll-indicator">scroll to reveal</div>
    </div>

    <div class="product-reveal-section">
        <div class="product-image-container" id="reveal-image">
            <span>Sarafina Shades</span>
        </div>
        
        <div class="colorways" id="colorways">
            <!-- Brand palette colorways -->
            <div class="color-swatch" style="background-color: var(--color-pink);" title="Rose Quartz"></div>
            <div class="color-swatch" style="background-color: var(--color-sage);" title="Matcha"></div>
            <div class="color-swatch" style="background-color: var(--color-slate);" title="Midnight"></div>
            <div class="color-swatch" style="background-color: var(--color-red);" title="Cherry"></div>
            <div class="color-swatch" style="background-color: var(--color-brown);" title="Espresso"></div>
        </div>

        <a href="#" class="preorder-btn" id="preorder-btn">Preorder Now</a>
    </div>

    <footer>
        <div class="social-links">
            <a href="https://instagram.com/amirecosmetics" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z" fill="var(--color-pink)"/></svg>

        <p style="color: var(--color-pink);">&copy; 2026 amiré. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const revealImage = document.getElementById('reveal-image');
            const colorways = document.getElementById('colorways');
            const preorderBtn = document.getElementById('preorder-btn');
            
            // Dynamic blur based on scroll
            window.addEventListener('scroll', () => {
                if (!revealImage) return;
                
                const rect = revealImage.getBoundingClientRect();
                const windowHeight = window.innerHeight;
                
                // Calculate how much of the element is visible
                // 0 = just entered bottom of screen, 1 = fully in middle of screen
                let visibility = (windowHeight - rect.top) / (windowHeight / 1.5);
                
                // Clamp visibility between 0 and 1
                visibility = Math.max(0, Math.min(1, visibility));
                
                // Max blur is 30px, min blur is 0px
                const blurAmount = 30 * (1 - visibility);
                revealImage.style.filter = `blur(${blurAmount}px)`;
                
                // Show colorways and button when fully unblurred
                if (visibility > 0.8) {
                    colorways.style.opacity = '1';
                    colorways.style.transform = 'translateY(0)';
                    
                    preorderBtn.style.opacity = '1';
                    preorderBtn.style.transform = 'translateY(0)';
                }
            });
            
            // Trigger scroll event once on load in case user refreshed while scrolled down
            window.dispatchEvent(new Event('scroll'));
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
