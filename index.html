<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amiré functional beauty</title>
    <meta name="description" content="functional beauty for the effortless cool girl.">
    <link rel="stylesheet" href="style.css?v=8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <a href="/" class="submark-link">
            <img src="amire-top-left-logo.png" alt="amiré logo" class="submark-img">
        </a>
        <nav class="nav-links">
            <a href="/sarafina-shades">Sarafina Shades</a>
            <a href="/founder">Our Founder</a>
        </nav>
    </header>

    <main class="hero-section">
        <img src="new-amire-logo.png" alt="amiré logo" class="center-logo">
        <h1 class="hero-subtitle baskerville-font">functional beauty.</h1>
        
        <div class="notify-form-container">
            <form id="notify-form" class="notify-form">
                <input type="email" id="email-input" placeholder="Enter email to get notified" required>
                <button type="submit" class="notify-btn">Join</button>
            </form>
            <div id="form-message" class="form-message"></div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <a href="/" class="submark-link">
                <img src="amire-footer-logo.png" alt="amiré logo" class="submark-img">
            </a>
            <div class="social-links">
                <a href="https://instagram.com/amirecosmetics" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                    <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z" fill="currentColor"/></svg>
                    <span>Instagram</span>
                </a>
                <a href="https://tiktok.com/@amirebeauty" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
                    <img src="tiktok-custom-logo.png" alt="TikTok">
                    <span>TikTok</span>
                </a>
            </div>
        </div>
        <p class="copyright">&copy; 2026 amiré. All rights reserved.</p>
    </footer>

    <script>
        const form = document.getElementById('notify-form');
        const messageDiv = document.getElementById('form-message');
        const formId = '7017631';
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email-input').value;
            messageDiv.textContent = 'Sending...';
            messageDiv.className = 'form-message';
            
            try {
                const response = await fetch(`https://app.convertkit.com/forms/${formId}/subscriptions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email_address: email })
                });
                
                if (response.ok) {
                    messageDiv.textContent = 'Success! Check your email to confirm.';
                    messageDiv.classList.add('success');
                    form.reset();
                } else {
                    throw new Error('Subscription failed');
                }
            } catch (err) {
                messageDiv.textContent = 'Oops! Something went wrong. Please try again.';
                messageDiv.classList.add('error');
            }
        });
    </script>
</body>
</html>
